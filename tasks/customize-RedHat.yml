---
- name: Generate random token for status page path
  ansible.builtin.set_fact:
    status_page_token: "{{ lookup('password', '/dev/null length=32 chars=ascii_letters,digits') }}"

- name: Add Custom Status Page Path to Apache Pre-Virtual Host
  ansible.builtin.blockinfile:
    path: /etc/apache2/conf.d/includes/pre_virtualhost_global.conf
    block: "{{ lookup('template', './templates/CustomStatusPage.block.j2') }}"
    marker: "# {mark} Ansible Managed Block"
    insertafter: "### END AUTOGENERATED BY LETS ENCRYPT FOR CPANEL PLUGIN ###"
    backup: yes
  notify:
    - rebuildhttpdconf

- name: Genereate collectd config file
  ansible.builtin.template:
    src: collectd.conf.j2
    dest: /etc/collectd.conf
    backup: true
    force: true
    mode: 0644

- name: Create plugins folder
  ansible.builtin.file:
    path: /opt/collectd-plugins
    state: directory
    mode: 0755

- name: Upload custom python plugins
  ansible.builtin.copy:
    src: plugins/
    dest: /opt/collectd-plugins
    mode: 0644

- name: Ensure setuptools is installed
  ansible.builtin.pip:
    name: setuptools

- name: Install collectd python package
  ansible.builtin.pip:
    name: collectd

- name: Enable and start collectd service
  ansible.builtin.service:
    name: collectd
    state: restarted
    enabled: yes
